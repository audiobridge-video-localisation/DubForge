[project]
name = "dubforge"
version = "0.1.0"
description = "Video localisation SaaS MVP"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pre-commit>=4.1",
  "psutil>=6.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "pipeline",
  "packages/contracts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "pipeline/src", "packages/contracts/src"]
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "pipeline/tests", "packages/contracts/tests"]
pythonpath = [
  "apps/api/src",
  "pipeline/src",
  "packages/contracts/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dubforge_api", "dubforge_pipeline", "dubforge_contracts"]
mypy_path = [
  "apps/api/src",
  "pipeline/src",
  "packages/contracts/src",
]

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true
