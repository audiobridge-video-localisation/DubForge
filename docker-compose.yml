services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dubforge
      POSTGRES_USER: dubforge
      POSTGRES_PASSWORD: dubforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubforge -d dubforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./pipeline:/app/pipeline
      - ./packages:/app/packages

volumes:
  postgres-data:
  redis-data:
