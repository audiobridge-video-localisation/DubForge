# The whole stack with one command:   docker compose up --build
#
#   web (nginx)  ->  api (FastAPI)  ->  postgres
#                         |
#                       redis  <-  pipeline (worker)
#
# Only the web app (and a localhost-only API port for tools like curl) is published to the
# host. Postgres and Redis stay on the internal network, so they can never clash with a
# database or Redis you already run locally. Settings come from `.env` (see .env.example);
# every value below has a working default.
name: dubforge

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dubforge
      POSTGRES_USER: dubforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dubforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubforge -d dubforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    # append-only file: queued jobs survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates / upgrades the database tables, then exits. The API only starts
  # once it has finished successfully, so a fresh checkout works with no manual step.
  migrate:
    build: *api-build
    image: dubforge-api:local
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dubforge:${POSTGRES_PASSWORD:-dubforge}@postgres:5432/dubforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *restart
    build: *api-build
    image: dubforge-api:local
    environment:
      DATABASE_URL: postgresql+asyncpg://dubforge:${POSTGRES_PASSWORD:-dubforge}@postgres:5432/dubforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/data
    volumes:
      - media-data:/app/data
    ports:
      # localhost only: handy for curl and the interactive docs at /docs
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  pipeline:
    <<: *restart
    build:
      context: .
      dockerfile: pipeline/Dockerfile
      args:
        # opt-in model packages, e.g. PIPELINE_EXTRAS="nllb tts-edge" (large: pulls torch)
        PIPELINE_EXTRAS: ${PIPELINE_EXTRAS:-}
    image: dubforge-pipeline:local
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: http://api:8000
      STORAGE_DIR: /app/data
      # downloaded models (Whisper, NLLB, MMS) are cached on the volume, once
      HF_HOME: /app/data/.cache/huggingface
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      TARGET_LANGS: ${TARGET_LANGS:-hi}
      MIN_SEGMENT_MS: ${MIN_SEGMENT_MS:-500}
    volumes:
      - media-data:/app/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *restart
    build:
      context: apps/web
    image: dubforge-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  media-data:
