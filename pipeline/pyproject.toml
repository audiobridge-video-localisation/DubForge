[project]
name = "dubforge-pipeline"
version = "0.1.0"
description = "DubForge media and AI processing pipeline"
requires-python = ">=3.12"
dependencies = [
  "dubforge-contracts",
  "ffmpeg-python>=0.2.0",
  "httpx>=0.28",
  "redis>=5.2",
]

[project.scripts]
dubforge-worker = "dubforge_pipeline.worker:run"

[tool.uv.sources]
dubforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubforge_pipeline"]
