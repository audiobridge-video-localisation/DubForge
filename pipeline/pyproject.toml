[project]
name = "dubforge-pipeline"
version = "0.1.0"
description = "DubForge media and AI processing pipeline"
requires-python = ">=3.12"
dependencies = [
  "dubforge-contracts",
  "faster-whisper>=1.1",
  "av>=11,<19",
  "httpx>=0.28",
  "redis>=5.2",
]

[project.optional-dependencies]
nllb = [
  "transformers>=5.19",
  "torch>=2.14",
  "sentencepiece>=0.2.2",
]
tts-edge = [
  "edge-tts>=7.2",
]
tts-mms = [
  "transformers>=5.19",
  "torch>=2.14",
  "scipy>=1.18",
]

[project.scripts]
dubforge-worker = "dubforge_pipeline.worker:run"

[tool.uv.sources]
dubforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubforge_pipeline"]
