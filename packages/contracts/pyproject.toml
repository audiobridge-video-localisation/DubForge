[project]
name = "dubforge-contracts"
version = "0.1.0"
description = "Shared DubForge domain and API contracts"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubforge_contracts"]
