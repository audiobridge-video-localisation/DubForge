server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # videos are large; the API is the one that decides what to accept
    client_max_body_size 2g;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/foo -> http://api:8000/foo. Docker's resolver is used per request, so the
    # proxy keeps working if the api container is recreated and gets a new address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # stream uploads straight through instead of buffering a whole video on disk
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # hashed build output never changes under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single-page app: every other path serves index.html (and is never cached)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
