[project]
name = "dubforge-api"
version = "0.1.0"
description = "DubForge HTTP API"
requires-python = ">=3.12"
dependencies = [
  "dubforge-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "python-multipart>=0.0.18",
]

[project.scripts]
dubforge-api = "dubforge_api.main:run"

[tool.uv.sources]
dubforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubforge_api"]
